<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Official Band Website for Phantom Radio Chatter. Listen, view photos, and connect with us!"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="canonical" href="https://phantomradiochatter.com/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Phantom Radio Chatter" />
    <meta property="og:title" content="Phantom Radio Chatter" />
    <meta
      property="og:description"
      content="Official band website. Listen, watch, and see tour dates."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://phantomradiochatter.com/" />
    <meta property="og:image" content="https://phantomradiochatter.com/photos/og-cover.jpg" />
    <meta
      property="og:image:secure_url"
      content="https://phantomradiochatter.com/photos/og-cover.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="2048" />
    <meta property="og:image:height" content="1152" />
    <meta property="og:image:alt" content="The members of Phantom Radio Chatter" />

    <!-- Twitter card (also used by many Android apps) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Phantom Radio Chatter" />
    <meta
      name="twitter:description"
      content="Official band website. Listen, watch, and see tour dates."
    />
    <meta name="twitter:image" content="https://phantomradiochatter.com/photos/og-cover.jpg" />

    <title>Phantom Radio Chatter</title>
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
